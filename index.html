<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Óculos Assistivo - Protótipo</title>
<style>
  body { background:#111; color:#eee; font-family: sans-serif; margin:0; padding:16px; }
  h1 { font-size: 1.3rem; text-align:center; margin: 4px 0 12px; }
  .stage { position: relative; width: 100%; max-width: 720px; margin: 0 auto; }
  video, canvas { width: 100%; border-radius: 8px; display:block; }
  canvas { position: absolute; top:0; left:0; pointer-events:none; }
  #depthView { top:8px; right:8px; left:auto; width:28%; border:1px solid #444; border-radius:6px; }
  #controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin: 14px auto; max-width:720px; }
  button { padding: 14px 20px; font-size: 1.05rem; cursor:pointer; border-radius:8px; border:none; background:#2ecc71; color:#111; font-weight:bold; }
  button.secondary { background:#e74c3c; color:#fff; }
  #muteBtn { background:#f1c40f; color:#111; }
  #describeBtn { background:#3b82f6; color:#fff; width:100%; max-width:720px; padding:22px; font-size:1.3rem; }
  button:disabled { background:#555; color:#aaa; cursor:not-allowed; }
  .center { text-align:center; }
  #sonar { text-align:center; font-size:1.1rem; margin: 6px 0; min-height:1.4em; }
  #depthStatus, #status { text-align:center; margin: 4px 0; color:#9fe; font-size:0.9rem; min-height:1.2em; }
  #depthStatus { color:#999; }
  #description { max-width:720px; margin: 10px auto; padding:12px; background:#1b2433; border-radius:8px; min-height:1.5em; font-size:1.05rem; }
  details { max-width:720px; margin: 10px auto; background:#1a1a1a; border-radius:8px; padding:10px; }
  details input { width:100%; box-sizing:border-box; padding:10px; font-size:1rem; margin:8px 0; background:#000; color:#eee; border:1px solid #444; border-radius:6px; }
  details small { color:#999; display:block; }
  #log { max-width:720px; margin: 12px auto; background:#000; padding:10px; border-radius:6px; height:130px; overflow-y:auto; white-space:pre-wrap; font-size:0.85rem; color:#7f7; }
</style>
</head>
<body>
<h1>Óculos Assistivo — Protótipo</h1>
<div class="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <canvas id="depthView" aria-label="Mapa de profundidade: claro é perto"></canvas>
</div>
<div id="sonar" aria-hidden="true"></div>
<div id="controls">
  <button id="startBtn" disabled>Iniciar</button>
  <button id="stopBtn" class="secondary" disabled>Parar</button>
  <button id="muteBtn" class="secondary" aria-pressed="false">Silenciar</button>
</div>
<div class="center"><button id="describeBtn" disabled>O que tem na minha frente?</button></div>
<div id="description" aria-live="polite"></div>
<div id="status">Carregando modelo de detecção...</div>
<div id="depthStatus">Profundidade: aguardando...</div>

<details id="aiSettings">
  <summary>Configurar descrição por IA (Claude)</summary>
  <small>A chave fica salva só neste aparelho e é enviada direto para a Anthropic. Use uma chave própria, com limite de gasto.</small>
  <input id="apiKeyInput" type="password" autocomplete="off" placeholder="Chave da API (sk-ant-...)">
  <button id="saveKeyBtn">Salvar chave</button>
  <button id="clearKeyBtn" class="secondary">Apagar chave</button>
</details>

<div id="log"></div>

<script>
  // Liga o isolamento da página (libera todos os núcleos do processador para a IA).
  // Na primeira visita o service worker é instalado e a página recarrega uma vez.
  if (!self.crossOriginIsolated && window.isSecureContext && "serviceWorker" in navigator) {
    navigator.serviceWorker.register("coi-sw.js").then(() => {
      let reloaded = true; // sem sessionStorage, não arrisca recarregar em laço
      try { reloaded = !!sessionStorage.getItem("coiReloaded"); } catch (e) {}
      if (!navigator.serviceWorker.controller && !reloaded) {
        try { sessionStorage.setItem("coiReloaded", "1"); } catch (e) {}
        navigator.serviceWorker.ready.then(() => location.reload());
      }
    }).catch((err) => console.warn("Service worker não registrado:", err));
  }
</script>
<!-- O COCO-SSD (TensorFlow.js) só é baixado pelo app.js se o YOLO não funcionar no aparelho. -->
<script src="app.js"></script>
</body>
</html>
