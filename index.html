<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Óculos Assistivo - Protótipo</title>
<style>
  body { background:#111; color:#eee; font-family: sans-serif; margin:0; padding:20px; }
  h1 { font-size: 1.3rem; text-align:center; }
  p.sub { text-align:center; color:#999; font-size:0.9rem; margin-top:-8px; }
  .stage { position: relative; width: 100%; max-width: 720px; margin: 20px auto 0; }
  video, canvas { width: 100%; border-radius: 8px; display:block; }
  canvas { position: absolute; top:0; left:0; pointer-events:none; }
  #controls { text-align:center; margin: 16px 0; }
  button { padding: 10px 24px; font-size: 1rem; cursor:pointer; border-radius:6px; border:none; background:#2ecc71; color:#111; font-weight:bold; }
  #controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button.secondary { background:#e74c3c; color:#fff; }
  #muteBtn { background:#f1c40f; color:#111; }
  button:disabled { background:#555; color:#aaa; cursor:not-allowed; }
  #depthView { position:absolute; top:8px; right:8px; left:auto; width:28%; border:1px solid #444; border-radius:6px; }
  #depthStatus { text-align:center; margin: 4px 0; color:#999; font-size:0.85rem; }
  #status { text-align:center; margin: 8px 0; color:#9fe; min-height:1.2em; }
  #log { max-width:720px; margin: 16px auto; background:#000; padding:10px; border-radius:6px; height:150px; overflow-y:auto; white-space:pre-wrap; font-size:0.85rem; color:#7f7; }
</style>
</head>
<body>
<h1>Protótipo — Detecção de Obstáculos no Caminho</h1>
<p class="sub">MVP em navegador: webcam + IA de visão computacional + alerta por voz</p>
<div class="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <canvas id="depthView" aria-label="Mapa de profundidade: claro é perto"></canvas>
</div>
<div id="depthStatus">Profundidade: carregando...</div>
<div id="controls">
  <button id="startBtn" disabled>Iniciar</button>
  <button id="stopBtn" class="secondary" disabled>Parar</button>
  <button id="muteBtn" class="secondary" aria-pressed="false">Silenciar</button>
</div>
<div id="status">Carregando modelo de detecção...</div>
<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
